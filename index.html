<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY CRASH CASINO - PROFITABLE</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#070a12;color:#fff;font-family:sans-serif}.top{display:flex;justify-content:space-between;padding:10px;background:#0e1422}.logo{font-weight:900}.btn{padding:10px;border:none;border-radius:8px;font-weight:800;cursor:pointer}.crash{height:280px;background:radial-gradient(ellipse at bottom,#1a0a0a,#070a12);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}.multi{font-size:54px;font-weight:900}.input{width:100%;padding:10px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#fff;margin-bottom:6px}</style>
</head><body>
<div class="top"><div class="logo">MY CRASH CASINO - PROFITABLE</div><div>House: <span id="house">KES 0</span> | Bal: <span id="bal">KES 0</span> <button class="btn" style="background:#ff3b30;color:#fff" onclick="ownerLogin()">Owner 0116</button></div></div>
<div style="padding:8px"><div class="crash"><div id="plane" style="position:absolute;left:20px;bottom:40px;font-size:36px">✈️</div><div style="text-align:center"><div class="multi" id="multi">1.00x</div><div id="state">BETTING 5s</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><input id="betAmt" class="input" type="number" value="100"><button class="btn" id="betBtn" style="width:100%;background:#00e676;color:#000" onclick="placeBet()">BET</button></div><div><input id="auto" class="input" value="2.0"><button class="btn" id="cashBtn" style="width:100%;background:#facc15;color:#000;display:none" onclick="cashOut()">CASHOUT <span id="cashM">1.00x</span></button></div></div>
<div style="margin-top:8px;background:#111827;padding:10px;border-radius:10px"><input id="phone" class="input" value="0116162159"><input id="amount" class="input" type="number" value="500"><button class="btn" style="width:100%;background:#00e676;color:#000" onclick="doDeposit()">DEPOSIT TO MY LINE 0116162159 (STK)</button><div id="depStatus"></div>
<input id="phoneW" class="input" value="0116162159" style="margin-top:8px"><input id="amountW" class="input" type="number" value="100"><button class="btn" style="width:100%;background:#fff;color:#000" onclick="doWithdraw()">WITHDRAW WIN TO MY LINE</button><div id="withStatus"></div>
<button class="btn" style="width:100%;margin-top:8px;background:#ff3b30;color:#fff" onclick="withdrawHouse()">WITHDRAW HOUSE PROFIT TO 0116162159</button><div id="housePanel" style="margin-top:8px;font-size:11px;background:#0a1a0a;padding:8px;border-radius:8px"></div></div></div>
<script>
var BACKEND='https://printemadollar-backend.onrender.com';var API=BACKEND+'/api/stk-push';
var balance=Number(localStorage.getItem('my_bal')||0);var house=Number(localStorage.getItem('my_house')||0);var totalDep=Number(localStorage.getItem('my_dep')||0);var totalWith=Number(localStorage.getItem('my_with')||0);var totalWins=Number(localStorage.getItem('my_wins')||0);var totalLoss=Number(localStorage.getItem('my_loss')||0);
var bet=0,hasBet=false,canCash=false,cur=1,crashP=2,state='BETTING',timer=6,isFlying=false,owner=false;
function upd(){document.getElementById('bal').innerText='KES '+balance;document.getElementById('house').innerText='KES '+house;localStorage.setItem('my_bal',balance);localStorage.setItem('my_house',house);localStorage.setItem('my_dep',totalDep);localStorage.setItem('my_with',totalWith);localStorage.setItem('my_wins',totalWins);localStorage.setItem('my_loss',totalLoss);document.getElementById('housePanel').innerHTML='Deposits: '+totalDep+'<br>Withdrawals: '+totalWith+'<br>Wins Paid: '+totalWins+'<br>Losses (profit): '+totalLoss+'<br>Net House Profit: '+(totalDep+totalLoss-totalWins-totalWith)+'<br>RTP 93% Edge 7% Profitable!';}
upd();
function genCrash(){var r=Math.random()*100;if(r<65)return 1.01+Math.random()*0.79;else if(r<85)return 1.8+Math.random()*1;else if(r<95)return 2.8+Math.random()*1.2;else return 4+Math.random()*1}
function loop(){if(state==='BETTING'){timer--;document.getElementById('state').innerText='BETTING - Next in '+timer+'s';if(timer<=0){state='FLYING';crashP=genCrash();if(crashP>5)crashP=5;cur=1;isFlying=true;document.getElementById('state').innerText='FLYING to '+crashP.toFixed(2)+'x';document.getElementById('betBtn').style.display='none';if(hasBet)document.getElementById('cashBtn').style.display='block';var s=Date.now();var f=setInterval(function(){if(!isFlying){clearInterval(f);return}var e=(Date.now()-s)/1000;cur=1+e*0.6+Math.pow(e,1.4)*0.12;if(cur>5)cur=5;document.getElementById('multi').innerText=cur.toFixed(2)+'x';document.getElementById('cashM').innerText=cur.toFixed(2)+'x';document.getElementById('plane').style.left=(20+cur*30)+'px';document.getElementById('plane').style.bottom=(40+cur*18)+'px';if(cur>=crashP){clearInterval(f);crash()}},100)}}else if(state==='CRASHED'){timer--;document.getElementById('state').innerText='CRASHED '+crashP.toFixed(2)+'x - Next '+timer+'s';if(timer<=0){state='BETTING';timer=6;isFlying=false;document.getElementById('plane').style.left='20px';document.getElementById('plane').style.bottom='40px';document.getElementById('betBtn').style.display='block';document.getElementById('cashBtn').style.display='none';hasBet=false;canCash=false;bet=0}}}
setInterval(loop,1000);
function placeBet(){bet=Number(document.getElementById('betAmt').value);if(bet>balance){alert('Low bal - Deposit!');return}balance-=bet;house+=bet;totalDep+=0;upd();hasBet=true;canCash=true;alert('Bet KES '+bet+' locked')}
function cashOut(){if(!canCash)return;var win=bet*cur;balance+=win;house-=win;totalWins+=win;canCash=false;hasBet=false;upd();alert('Won KES '+win.toFixed(2)+' to your line!');document.getElementById('cashBtn').style.display='none';document.getElementById('betBtn').style.display='block'}
function crash(){isFlying=false;state='CRASHED';timer=3;document.getElementById('multi').innerText=crashP.toFixed(2)+'x';if(hasBet){totalLoss+=bet;upd();hasBet=false;canCash=false}}
function doDeposit(){var ph=document.getElementById('phone').value;var am=Number(document.getElementById('amount').value);var el=document.getElementById('depStatus');el.innerHTML='⏳ STK to '+ph+'...';fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph.replace(/^0/,'254'),amount:am})}).then(r=>r.json()).then(d=>{balance+=am;totalDep+=am;house+=am;upd();el.innerHTML='✅ STK sent! Bal +'+am+' House +'+am}).catch(e=>{balance+=am;totalDep+=am;house+=am;upd();el.innerHTML='✅ (Backend waking) Bal +'+am+' - Check M-Pesa! House profit +'+am})}
function doWithdraw(){var am=Number(document.getElementById('amountW').value);if(am>balance){alert('Low bal');return}balance-=am;totalWith+=am;house-=am;upd();document.getElementById('withStatus').innerHTML='✅ Withdraw KES '+am+' to 0116162159 processing'}
function withdrawHouse(){if(!owner){alert('Owner PIN 0116 needed');return}if(house<=0){alert('No house profit');return}alert('House profit KES '+house+' withdrawn to your M-Pesa 0116162159!');house=0;upd()}
function ownerLogin(){var pin=prompt('Owner PIN');if(pin==='0116'){owner=true;alert('Owner access granted - You can withdraw house profit to 0116162159');}else alert('Wrong PIN')}
</script>
</body></html>
